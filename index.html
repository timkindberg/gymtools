<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>gymtools — your pocket trainer</title>
  <meta name="description" content="A personal-trainer PWA that plans injury-aware workouts and tracks every set, rep, and symptom." />
  <meta name="theme-color" content="#ff5a3c" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="gymtools" />
  <link rel="stylesheet" href="./css/styles.css" />
  <!-- Every module, named up front: without this the browser finds them one
       import at a time and a first load is a chain of round trips. -->
  <link rel="modulepreload" href="./js/app.js" />
  <link rel="modulepreload" href="./js/config.js" />
  <link rel="modulepreload" href="./js/effort.js" />
  <link rel="modulepreload" href="./js/engine.js" />
  <link rel="modulepreload" href="./js/goals.js" />
  <link rel="modulepreload" href="./js/measures.js" />
  <link rel="modulepreload" href="./js/movements.js" />
  <link rel="modulepreload" href="./js/orientation.js" />
  <link rel="modulepreload" href="./js/plates.js" />
  <link rel="modulepreload" href="./js/program.js" />
  <link rel="modulepreload" href="./js/sets.js" />
  <link rel="modulepreload" href="./js/store.js" />
  <link rel="modulepreload" href="./js/sync.js" />
  <link rel="modulepreload" href="./js/ui.js" />
  <link rel="modulepreload" href="./js/version.js" />
  <style>
    /* Painted before the stylesheet or any script arrives, so a slow start
       shows the app is coming instead of an empty screen. */
    html { background: #0e0f13; }
    @media (prefers-color-scheme: light) { html { background: #f4f5f7; } }
    .boot { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 6px;
            font: 700 22px system-ui, sans-serif; color: #ff6b4d; }
    .boot small { font: 500 13px system-ui, sans-serif; color: #9aa1af; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"><div class="boot">gymtools<small>Loading…</small></div></main>

  <nav id="nav" aria-label="Primary"></nav>

  <script type="module" src="./js/app.js"></script>
  <noscript><p style="padding:24px">gymtools needs JavaScript enabled.</p></noscript>
</body>
</html>
