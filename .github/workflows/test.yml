name: Tests

# The data model (movements, set roles, typed measures) is pure JS with no
# dependencies, so this is just node's built-in test runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
